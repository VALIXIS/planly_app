name: planly
description: "Planly is a Flutter task planner with reminders, calendar views, focus mode, and daily reflection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Google Mobile Ads
  google_mobile_ads: ^5.2.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Calendar & date formatting
  intl: ^0.18.1
  table_calendar: ^3.0.9

  # Notifications
  flutter_timezone: ^5.0.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # External links and email intents
  url_launcher: ^6.3.1

  # 🎉 Confetti animation
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
