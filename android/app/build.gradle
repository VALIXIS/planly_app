plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKeystore = keystorePropertiesFile.exists()
def releaseAdMobAppId = keystoreProperties.getProperty("adMobAppId")?.trim()
def isReleaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release") || taskName.toLowerCase().contains("bundle")
}

android {
    namespace "com.js.planly"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.js.planly"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        manifestPlaceholders["adMobAppId"] = (releaseAdMobAppId && !releaseAdMobAppId.isEmpty()) ? releaseAdMobAppId : "ca-app-pub-3940256099942544~3347511713"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
                storeFile file(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (!hasReleaseKeystore && isReleaseBuildRequested) {
                throw new GradleException("Missing android/key.properties. Add release keystore details before building a Play Store bundle.")
            }
            if (isReleaseBuildRequested && (!releaseAdMobAppId || releaseAdMobAppId.isEmpty())) {
                throw new GradleException("Missing adMobAppId in android/key.properties. Add your real AdMob app ID before building a release bundle.")
            }
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

flutter {
    source "../.."
}
